name: "GitHub SSH Action"
description: "Run SSH commands against a remote host."
author: ""
inputs:
  host:
    description: "SSH host to connect to."
    required: true
  username:
    description: "SSH username."
    required: true
  port:
    description: "SSH port."
    required: false
    default: "22"
  password:
    description: "SSH password (for password auth)."
    required: false
  private_key:
    description: "SSH private key (for key auth)."
    required: false
  private_key_passphrase:
    description: "Passphrase for the SSH private key."
    required: false
  host_key_fingerprint:
    description: >-
      Expected SHA256 fingerprint of the remote host's SSH key (e.g. the output of
      `ssh-keyscan -t ed25519 <host> | ssh-keygen -lf -`, in `SHA256:...` form). When set, the
      connection is refused if the host key does not match, protecting against
      man-in-the-middle attacks. If omitted, the host key is trusted on first use without
      verification.
    required: false
  command_timeout:
    description: "Maximum time in seconds to wait for each command to finish. Default: 300."
    required: false
    default: "300"
  command:
    description: "Command(s) to execute on the remote host. Provide a single line or a multiline list."
    required: true
outputs:
  stdout:
    description: "Standard output from the remote command."
  stderr:
    description: "Standard error from the remote command."
  exit_code:
    description: "Exit code from the remote command."
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "terminal"
  color: "blue"

