name: CI

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run bundle

      - name: Ensure dist is up to date
        run: git diff --exit-code

  publish:
    needs: [lint, test-build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build dist
        run: npm run bundle

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push dist to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Fetch tags so the release tag is available locally
          git fetch --tags origin

          # Create a temporary branch from the release tag so we can commit the built dist
          git checkout -b publish/${RELEASE_TAG} "refs/tags/${RELEASE_TAG}^{commit}" || git checkout -B publish/${RELEASE_TAG} "refs/tags/${RELEASE_TAG}^{commit}"

          # Replace dist and commit (if there are changes)
          git rm -rf dist || true
          git add -f dist
          git commit -m "chore(release): build dist for ${RELEASE_TAG}" || echo "No changes to commit"

          # Create or update the tag to point to this new commit (force if necessary)
          git tag -fa "${RELEASE_TAG}" -m "dist for ${RELEASE_TAG}"

          # Push the tag to the remote, forcing update of the tag ref if it already exists
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO} refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG} --force
