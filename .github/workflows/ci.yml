name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest -v

  action-smoke-test:
    # Exercises the composite action exactly as a consumer would (`uses: ./`), against a real
    # local sshd running directly on the runner. This is also a regression test for the switch
    # from a Docker container action to a composite action: composite steps run natively on the
    # runner, sharing its network/DNS stack, unlike an isolated Docker container.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and start a local SSH server
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -f /tmp/gh_ssh_action_test_key -N "" -q
          cat /tmp/gh_ssh_action_test_key.pub >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          {
            echo "private_key<<GH_SSH_ACTION_KEY_EOF"
            cat /tmp/gh_ssh_action_test_key
            echo "GH_SSH_ACTION_KEY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "username=$(whoami)" >> "$GITHUB_OUTPUT"
        id: sshd

      - name: "Run SSH command via this action (composite, uses: ./)"
        id: ssh
        uses: ./
        with:
          host: 127.0.0.1
          username: ${{ steps.sshd.outputs.username }}
          private_key: ${{ steps.sshd.outputs.private_key }}
          command: |
            echo "hello from the composite action"
            whoami

      - name: Verify outputs
        env:
          SSH_STDOUT: ${{ steps.ssh.outputs.stdout }}
          SSH_EXIT_CODE: ${{ steps.ssh.outputs.exit_code }}
        run: |
          set -euo pipefail
          echo "--- stdout ---"
          echo "$SSH_STDOUT"
          echo "--- exit_code ---"
          echo "$SSH_EXIT_CODE"

          if [[ "$SSH_EXIT_CODE" != "0" ]]; then
            echo "Expected exit_code 0"
            exit 1
          fi
          if [[ "$SSH_STDOUT" != *"hello from the composite action"* ]]; then
            echo "Expected stdout output not found"
            exit 1
          fi

  docker-image:
    # This Dockerfile is NOT used by action.yml (see the note there for why) — it's kept only as
    # an optional, standalone container image for anyone who wants to run this tool outside of
    # GitHub Actions. This job just checks it still builds and runs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t gh-ssh-action:ci .

      - name: Smoke test container
        run: |
          docker run --rm \
            -e INPUT_HOST=127.0.0.1 \
            -e INPUT_USERNAME=root \
            -e INPUT_PASSWORD=secret \
            -e INPUT_PORT=22 \
            -e INPUT_COMMAND=uptime \
            gh-ssh-action:ci && exit 1 || echo "Container ran and failed as expected (no SSH server available)."

      - name: Smoke test container with a GitHub Actions-like HOME
        # Regression test: a Docker-based runner (or a Docker action) can override HOME with a
        # host-mounted directory that isn't writable by this image's non-root user. Anything at
        # container start that tries to write under $HOME (e.g. `uv run`'s cache init) fails with
        # "Permission denied" in that environment even though it works fine locally. This
        # reproduces that exact scenario so a regression fails CI.
        run: |
          mkdir -p /tmp/fake_github_home
          chmod 000 /tmp/fake_github_home
          output=$(docker run --rm \
            -e HOME=/github/home \
            -v /tmp/fake_github_home:/github/home \
            -e INPUT_HOST=127.0.0.1 \
            -e INPUT_USERNAME=root \
            -e INPUT_PASSWORD=secret \
            -e INPUT_PORT=22 \
            -e INPUT_COMMAND=uptime \
            gh-ssh-action:ci 2>&1) && exit_code=0 || exit_code=$?
          echo "$output"
          if echo "$output" | grep -qi "permission denied"; then
            echo "Container failed due to a HOME/cache permission error, not the expected SSH connection error."
            exit 1
          fi
          if [ "$exit_code" -eq 0 ]; then
            echo "Expected the container to fail (no SSH server available), but it exited 0."
            exit 1
          fi
          echo "Container ran and failed as expected (no SSH server available), with no HOME permission error."

