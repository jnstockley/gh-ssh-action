name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t gh-ssh-action:ci .

      - name: Smoke test container
        run: |
          docker run --rm \
            -e INPUT_HOST=127.0.0.1 \
            -e INPUT_USERNAME=root \
            -e INPUT_PASSWORD=secret \
            -e INPUT_PORT=22 \
            -e INPUT_COMMAND=uptime \
            gh-ssh-action:ci && exit 1 || echo "Container ran and failed as expected (no SSH server available)."
